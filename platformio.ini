; PlatformIO device build for the Toki Pona dictionary (ADR-0005).
;
; The host lane (`npm run test:host`) is the correctness oracle for everything pure; this file
; only builds the firmware. Our sources live in top-level core/ hal/ app/ main/ (not src/), so
; src_dir is the repo root and build_src_filter selects exactly those trees — test/ and tools/
; are never compiled here, keeping the device build disjoint from the host lane (ADR-0005 #4).

[platformio]
src_dir = .
default_envs = tp_cardputer

; ========================================
; Shared embedded settings
; ========================================
[env_embedded]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; gnu++17 (not strict c++17): LovyanGFX and the ESP32 Arduino core rely on GNU extensions.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I core
    -I hal
    -I app
; Compile only our four layers; tests and build tooling are the host lane's, not the device's.
build_src_filter =
    -<*>
    +<core/>
    +<hal/>
    +<app/>
    +<main/>
lib_deps =
    lovyan03/LovyanGFX@^1.2.0

; ========================================
; M5Stack Cardputer (ESP32-S3, no PSRAM) — original and ADV, one image (ADR-0005 #2)
; ========================================
[env:tp_cardputer]
extends = env_embedded
; pioarduino platform (ESP32 Arduino 3.x / ESP-IDF 5.x), the same release the sapper builds on.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
board = m5stack-stamps3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; StampS3 has NO PSRAM: no memory_type override (qio_opi would force octal-PSRAM boot init that
; fails on a chip-less board). QIO flash set explicitly.
board_build.flash_mode = qio
build_flags =
    ${env_embedded.build_flags}
    -DTP_BOARD_CARDPUTER=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_ESP32S3_DEV=1
