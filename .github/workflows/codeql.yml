name: CodeQL

# Semantic security analysis of our C/C++ firmware. Findings surface as Code Scanning alerts in the
# Security tab. Runs on push/PR and weekly on a schedule so a newly-disclosed query pattern is
# caught even without a code change. No branch filter — the repo's default branch may be master or
# main, and ci.yml likewise runs on every push.
on:
  push:
  pull_request:
  schedule:
    - cron: '27 4 * * 1'  # weekly, Monday 04:27 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The pioarduino ESP32 platform requires Python 3.10-3.13; '3.x' resolves to 3.14 on
          # current runners and the platform hard-rejects it.
          python-version: '3.13'

      # CodeQL for c-cpp traces a real compilation, so build the firmware between init and analyze —
      # autobuild cannot drive PlatformIO. Cache the platform/toolchain as ci.yml does.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-codeql-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-codeql-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build firmware (cardputer)
        run: pio run -e tp_cardputer

      # Analyze, but do NOT upload yet. paths-ignore is inert for compiled languages, so CodeQL has
      # also analyzed the vendored libraries compiled into .pio/libdeps. Strip those by path first.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          upload: false
          output: sarif-results

      # Drop every result under .pio/, third_party/, or test/ — vendored dependencies, build-time
      # font assets, and host mocks we do not own and will not patch. jq keeps this dependency-free
      # and is null-safe: a result without a location is kept rather than crashing the filter.
      - name: Filter vendored dependencies from results
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in sarif-results/*.sarif; do
            jq '(.runs[].results) |= map(select(
              ((.locations[0].physicalLocation.artifactLocation.uri)? // "") as $u
              | ($u|startswith(".pio/")) or ($u|startswith("third_party/")) or ($u|startswith("test/"))
              | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Upload filtered results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: "/language:c-cpp"
